<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>电脑</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:15px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
#scr{max-width:100%;max-height:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none;transform-origin:0 0;will-change:transform}
#hint{position:absolute;color:#888;font-size:14px}
.dot{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.18);pointer-events:none;animation:f .5s forwards}
.dot.edit{border-color:#4cd964;background:rgba(76,217,100,.25)}
@keyframes f{to{opacity:0;transform:scale(1.6)}}
#chip{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:12px;padding:3px 10px;border-radius:10px;background:rgba(40,40,40,.85);color:#bbb;transition:opacity .4s;pointer-events:none}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));height:52px;min-width:52px;border-radius:26px;border:0;background:rgba(44,44,46,.92);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0 18px;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:opacity .2s}
.fab svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#clip{left:16px;padding:0}
#kb{right:16px;padding:0}
#done{right:80px}
body.typing .fab{opacity:0;pointer-events:none}
.fab.pulse{animation:pl .8s 3;background:#2a83f6}
@keyframes pl{50%{transform:scale(1.15)}}
#ime{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;caret-color:transparent}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#1c1c1e;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:none}
#sheet textarea{width:100%;height:90px;border:0;border-radius:10px;background:#2c2c2e;color:#fff;padding:10px;font-size:16px;resize:none;outline:none}
#sheet .r{display:flex;gap:10px;margin-top:10px}
#sheet button{flex:1;height:44px;border:0;border-radius:12px;background:#2c2c2e;color:#fff;font-size:16px}
#sheet button.p{background:#fff;color:#000}
</style>
</head>
<body>
<div id="stage"><div id="hint">正在连接电脑……</div><img id="scr" alt=""></div>
<div id="chip">连接中</div>
<button class="fab" id="clip" aria-label="粘贴文字"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg></button>
<button class="fab" id="done">我完成了</button>
<button class="fab" id="kb" aria-label="键盘"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
<textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<div id="sheet">
  <textarea id="paste" placeholder="把要输入的文字粘贴或写在这里，会直接打到电脑上光标所在的位置"></textarea>
  <div class="r"><button id="pCancel">取消</button><button class="p" id="pSend">发送到电脑</button></div>
</div>
<script>
// initData comes in the URL hash; tg.js only loads in the background (slow links shouldn't block the page)
let tg = null;
const INIT = new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
(() => { const sc = document.createElement("script"); sc.src = "tg.js"; sc.async = true;
  sc.onload = () => { tg = window.Telegram && Telegram.WebApp; if (!tg) return; tg.ready(); tg.expand();
    try { tg.disableVerticalSwipes(); } catch (e) {} try { tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); } catch (e) {} };
  document.head.appendChild(sc); })();
const $ = id => document.getElementById(id);
const scr = $("scr"), chip = $("chip"), stage = $("stage"), ime = $("ime");
const hap = s => { try { tg && tg.HapticFeedback.impactOccurred(s || "light"); } catch (e) {} };

// ---------- frames: long-poll; server only answers when the picture changed
let h = "", url = null, alive = true, chipTimer = 0;
async function loop() {
  while (alive) {
    const t0 = performance.now();
    try {
      const r = await fetch("api/frame?h=" + h, {headers: {"X-Init-Data": INIT}, cache: "no-store"});
      if (r.status === 403) { chip.textContent = "只能由本人在 Telegram 里打开"; chip.style.opacity = 1; return; }
      if (r.status === 200) {
        h = r.headers.get("X-H") || "";
        const u = URL.createObjectURL(await r.blob());
        scr.onload = () => { if (url) URL.revokeObjectURL(url); url = u; };
        scr.src = u; $("hint").style.display = "none";
        showChip("已连接 · " + Math.round(performance.now() - t0) + "ms");
      }
    } catch (e) { showChip("重连中…", true); await new Promise(r => setTimeout(r, 800)); }
  }
}
function showChip(t, stay) { chip.textContent = t; chip.style.opacity = 1; clearTimeout(chipTimer); if (!stay) chipTimer = setTimeout(() => chip.style.opacity = 0, 2500); }
function send(o) {
  return fetch("api/in", {method: "POST", headers: {"Content-Type": "application/json", "X-Init-Data": INIT}, body: JSON.stringify(o)})
    .then(r => r.json()).catch(() => ({}));
}

// ---------- view transform: zoom zs, pan tx/ty, plus kbShift while the keyboard is up
let zs = 1, tx = 0, ty = 0, kbShift = 0;
function vh() { return window.visualViewport ? visualViewport.height : innerHeight; }
function clampPan() {
  const w = scr.offsetWidth * zs, hh = scr.offsetHeight * zs, bx = scr.offsetLeft, by = scr.offsetTop, VW = innerWidth, VH = innerHeight;
  tx = w <= VW ? (VW - w) / 2 - bx : Math.min(-bx, Math.max(VW - w - bx, tx));
  ty = hh <= VH ? (VH - hh) / 2 - by : Math.min(-by, Math.max(VH - hh - by, ty));
}
function applyZ() {
  if (zs <= 1.02) zs = 1;
  clampPan();
  scr.style.transform = `translate(${tx}px,${ty + kbShift}px) scale(${zs})`;
}
function norm(cx, cy) {
  const r = scr.getBoundingClientRect();
  return {x: (cx - r.left) / r.width, y: (cy - r.top) / r.height, ok: cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom};
}
function dot(x, y, cls) { const d = document.createElement("div"); d.className = "dot" + (cls ? " " + cls : ""); d.style.left = x + "px"; d.style.top = y + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 600); }

// ---------- gestures
// 1 finger: tap = click (text field -> keyboard opens), swipe = pan when zoomed / scroll page,
//           long-press then move = mouse drag.   2 fingers: pinch = zoom, move = pan.
let g = null, pinch = null, lockSingle = false, lastTapN = null;
const pts = new Map();
stage.addEventListener("touchstart", e => e.preventDefault(), {passive: false});
function cancelSingle() { if (!g) return; clearTimeout(g.timer); if (g.mode === "drag") send({t: "up"}); g = null; }
function pinchStart() {
  const [a, b] = [...pts.values()];
  pinch = {d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: zs, m0: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}, t0: {x: tx, y: ty}};
}
stage.addEventListener("pointerdown", ev => {
  pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  if (pts.size === 2) { cancelSingle(); lockSingle = true; pinchStart(); return; }
  if (pts.size > 2 || g || lockSingle) return;
  const p = norm(ev.clientX, ev.clientY); if (!p.ok && zs === 1) return;
  g = {id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, lx: ev.clientX, ly: ev.clientY, mode: "tap", p0: p, acc: 0, lastMove: 0};
  g.timer = setTimeout(() => { if (g && g.mode === "tap" && g.p0.ok) { g.mode = "drag"; hap("medium"); send({t: "down", x: p.x, y: p.y}); } }, 450);
});
stage.addEventListener("pointermove", ev => {
  if (!pts.has(ev.pointerId)) return;
  pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), m = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
    const bx = scr.offsetLeft, by = scr.offsetTop;
    // content point under the starting midpoint stays under the fingers (zoom + pan in one)
    const px = (pinch.m0.x - bx - pinch.t0.x) / pinch.s0, py = (pinch.m0.y - by - pinch.t0.y) / pinch.s0;
    zs = Math.min(5, Math.max(1, pinch.s0 * d / pinch.d0));
    tx = m.x - bx - zs * px; ty = m.y - by - zs * py;
    applyZ();
    return;
  }
  if (!g || ev.pointerId !== g.id) return;
  if (g.mode === "tap" && Math.hypot(ev.clientX - g.x0, ev.clientY - g.y0) > 10) { g.mode = "swipe"; clearTimeout(g.timer); }
  if (g.mode === "swipe") {
    const dx = ev.clientX - g.lx, dy = ev.clientY - g.ly; g.lx = ev.clientX; g.ly = ev.clientY;
    let rest = dy;
    if (zs > 1) {   // pan the zoomed picture first; what's left over vertically scrolls the page
      const oy = ty; tx += dx; ty += dy; applyZ(); rest = dy - (ty - oy);
    }
    g.acc -= rest;
    const n = Math.trunc(g.acc / 40);
    if (n && g.p0.ok) { g.acc -= n * 40; send({t: "scroll", n, x: g.p0.x, y: g.p0.y}); }
  } else if (g.mode === "drag" && Date.now() - g.lastMove > 40) {
    g.lastMove = Date.now(); const p = norm(ev.clientX, ev.clientY); send({t: "move", x: p.x, y: p.y});
  }
});
function end(ev) {
  pts.delete(ev.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0) lockSingle = false;
  if (!g || ev.pointerId !== g.id) return;
  clearTimeout(g.timer);
  if (g.mode === "tap" && g.p0.ok) {
    const cx = ev.clientX, cy = ev.clientY, p = g.p0;
    dot(cx, cy); hap();
    send({t: "click", x: p.x, y: p.y}).then(r => { if (r && r.edit) { dot(cx, cy, "edit"); lastTapN = p; kbOpen(); } });
  } else if (g.mode === "drag") { const p = norm(ev.clientX, ev.clientY); send({t: "up", x: p.x, y: p.y}); }
  g = null;
}
stage.addEventListener("pointerup", end);
stage.addEventListener("pointercancel", end);

// ---------- keyboard: phone IME types straight into the remote cursor.
// A sentinel char stays in the hidden box so Backspace always produces an event on Android IMEs.
const SENT = "​";
let composing = false, fullH = innerHeight;
function resetIme() { ime.value = SENT; try { ime.setSelectionRange(1, 1); } catch (e) {} }
function kbOpen() {
  resetIme(); ime.focus({preventScroll: true}); document.body.classList.add("typing");
  const H0 = vh();
  setTimeout(() => {   // some WebViews refuse to raise the keyboard outside a direct tap: fall back to a hint on ⌨
    if (vh() > H0 - 80 && vh() > fullH - 120) { document.body.classList.remove("typing"); $("kb").classList.add("pulse"); showChip("点右下角 ⌨ 打字"); setTimeout(() => $("kb").classList.remove("pulse"), 2500); }
  }, 700);
}
function kbClose() { ime.blur(); }
$("kb").onclick = () => { lastTapN = null; kbOpen(); };
ime.addEventListener("focus", () => document.body.classList.add("typing"));
ime.addEventListener("blur", () => { document.body.classList.remove("typing"); kbShift = 0; applyZ(); });
ime.addEventListener("compositionstart", () => composing = true);
ime.addEventListener("compositionend", e => { composing = false; if (e.data) send({t: "type", text: e.data}); resetIme(); });
ime.addEventListener("input", e => {
  if (composing || e.isComposing) return;
  const v = ime.value;
  if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph" || v.endsWith("\n")) send({t: "key", k: "Return"});
  else if (e.inputType === "deleteContentBackward" || !v.includes(SENT)) send({t: "key", k: "BackSpace"});
  else { const txt = v.replace(SENT, ""); if (txt) send({t: "type", text: txt}); }
  resetIme();
});
ime.addEventListener("keydown", e => { if (!composing && e.key === "Enter") { e.preventDefault(); send({t: "key", k: "Return"}); } });
// keyboard shown/hidden -> keep the tapped field visible above it
function onResize() {
  const H = vh(), up = H < fullH - 120;
  if (!up) fullH = Math.max(fullH, H);
  kbShift = 0; applyZ();
  if (up && lastTapN) {
    const r = scr.getBoundingClientRect(), y = r.top + lastTapN.y * r.height;
    if (y > H - 70 || y < 40) { kbShift = H * 0.4 - y; applyZ(); }
  }
  if (!up && document.activeElement === ime) kbClose();   // keyboard dismissed with the system button
}
if (window.visualViewport) visualViewport.addEventListener("resize", onResize);
window.addEventListener("resize", onResize);

// ---------- clipboard sheet / done
$("clip").onclick = () => { kbClose(); $("sheet").style.display = "block"; $("paste").focus(); };
$("pCancel").onclick = () => { $("sheet").style.display = "none"; $("paste").blur(); };
$("pSend").onclick = () => { const t = $("paste").value; if (t) send({t: "type", text: t}); $("paste").value = ""; $("pCancel").onclick(); };
$("done").onclick = async () => { hap("medium"); await send({t: "done"}); if (tg) tg.close(); else showChip("已完成，可以关掉这个页面", true); };

// leaving (closing with X / switching app) tells the server, so the public port closes soon
function leave() { try { fetch("api/in", {method: "POST", keepalive: true, headers: {"Content-Type": "application/json", "X-Init-Data": INIT}, body: JSON.stringify({t: "leave"})}); } catch (e) {} }
window.addEventListener("pagehide", leave);
document.addEventListener("visibilitychange", () => { if (document.hidden) { leave(); alive = false; } else if (!alive) { alive = true; loop(); } });

send({t: "open"});
loop();
</script>
</body>
</html>
