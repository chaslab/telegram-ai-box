name: smoke
on: { workflow_dispatch: {} }   # run by hand: gh workflow run smoke
jobs:
  fresh-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo -i bash "$GITHUB_WORKSPACE/test/smoke.sh"
      - if: always()
        run: sudo cp /tmp/desk.jpg . 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: desk-screenshot, path: desk.jpg, if-no-files-found: ignore }
